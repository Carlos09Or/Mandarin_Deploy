<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7f0" />
    <meta name="description" content="Learn HSK 1 Mandarin for free: lessons, hanzi writing and review." />
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 80;
        overflow: hidden;
      }
      #boot-art {
        position: absolute;
        left: 50%;
        bottom: 0;
        translate: -50% 0;
        width: min(100vw, calc(100dvh * 941 / 1672));
        height: auto;
        mask-image: linear-gradient(to bottom, transparent 0, #000 9%);
      }
    </style>
    <title>Mandarin Journey · HSK 1</title>
    <script>
      // Which light the learner is in, and the splash painting for it. This runs in <head>, ahead of the stylesheet and
      // the app's script, so the painting is requested at once instead of after the CSS (a script in <body> waits for
      // every stylesheet above it, which on a slow line was seconds).
      ;(function () {
        var night = new Date().getHours() < 6 || new Date().getHours() >= 19
        try {
          var scenery = JSON.parse(localStorage.getItem('mlh.progress.v1') || '{}').scenery
          if (scenery === 'night' || scenery === 'day') night = scenery === 'night'
        } catch (e) {}
        var src = '%BASE_URL%journey/splash-' + (night ? 'night' : 'day') + '.webp'
        window.__boot = { night: night, src: src }
        var hint = document.createElement('link')
        hint.rel = 'preload'
        hint.as = 'image'
        hint.href = src
        hint.setAttribute('fetchpriority', 'high')
        document.head.appendChild(hint)
      })()
    </script>
  </head>
  <body>
    <!-- Shown the moment the page arrives, before any script is downloaded: the same painting and sky as the
         loading screen (src/journey/Splash.tsx), which takes over from it and then removes this. -->
    <div id="boot" aria-hidden="true">
      <img id="boot-art" alt="" />
    </div>
    <script>
      var boot = document.getElementById('boot')
      boot.style.background = window.__boot.night ? '#013379' : '#46acf9'
      document.getElementById('boot-art').src = window.__boot.src
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
