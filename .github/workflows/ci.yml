name: Checks

# Runs on every pull request, so a change can't reach main (which deploys itself) with a type error, a vulnerable
# dependency, a progress validator that refuses what clients send, or a build that has lost its security headers.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # tsc -b checks the app, the Worker and the build config; `npm run build` runs it first.
      - run: npm run build
      - run: npm run lint
      # Only what ships to learners (not build tools), and only what is high or critical.
      - run: npm audit --omit=dev --audit-level=high
      - run: node --experimental-strip-types --test ../tools/validate-progress.test.mjs
      # The build writes dist/_headers (vite.config.ts); without it the page loses its CSP.
      - name: Security headers are in the build
        run: |
          grep -q "content-security-policy: default-src 'none'; script-src 'self' 'sha256-" dist/_headers
          grep -q "frame-ancestors 'none'" dist/_headers
          grep -q "strict-transport-security" dist/_headers
