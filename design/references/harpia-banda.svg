<svg viewBox="0 0 200 200" class="friend friend-idle" aria-label="Yīngyīng, the harpy eagle" xmlns="http://www.w3.org/2000/svg"><style>.wawa { overflow: visible; }
.wawa g, .wawa ellipse { transform-box: view-box; }
.wawa-frog, .wawa-breathe, .wawa-shadow { transform-origin: 100px 186px; }
.wawa-eye-l { transform-origin: 68px 64px; }
.wawa-eye-r { transform-origin: 132px 64px; }
.wawa-arm-l { transform-origin: 50px 112px; }
.wawa-arm-r { transform-origin: 150px 112px; }
.wawa-arm-l, .wawa-arm-r, .wawa-pupil { transition: transform 0.25s ease-out; }
.wawa-breathe { animation: 2.6s ease-in-out 0s infinite normal none running wawa-breathe; }
.wawa-eye { animation: 4.4s ease 0s infinite normal none running wawa-blink; }
.wawa-spark { transform-box: fill-box; transform-origin: center center; animation: 1.2s ease-in-out 0s infinite normal none running wawa-twinkle; }
.wawa-arm-up { display: none; }
.wawa-happy .wawa-arm-up, .wawa-celebrate .wawa-arm-up, .wawa-fire .wawa-arm-up, .wawa-wave .wawa-arm-r .wawa-arm-up { display: inline; }
.wawa-happy .wawa-arm-down, .wawa-celebrate .wawa-arm-down, .wawa-fire .wawa-arm-down, .wawa-wave .wawa-arm-r .wawa-arm-down { display: none; }
.wawa-happy .wawa-frog { animation: 0.6s ease-out 0s 2 normal none running wawa-hop; }
.wawa-celebrate .wawa-frog { animation: 1.2s cubic-bezier(0.3, 0.7, 0.4, 1) 0s infinite normal none running wawa-jump; }
.wawa-celebrate .wawa-shadow { animation: 1.2s cubic-bezier(0.3, 0.7, 0.4, 1) 0s infinite normal none running wawa-shadow-jump; }
.wawa-celebrate .wawa-arm-l { animation: 0.3s ease-in-out 0s infinite alternate none running wawa-cheer-l; }
.wawa-celebrate .wawa-arm-r { animation: 0.3s ease-in-out 0s infinite alternate none running wawa-cheer-r; }
.wawa-wave .wawa-arm-r { animation: 0.45s ease-in-out 0s infinite alternate none running wawa-wave; }
.wawa-sad .wawa-frog { animation: 1.8s ease-in-out 0s infinite normal none running wawa-droop; }
.wawa-sad .wawa-pupil { transform: translate(-2px, 5px); }
.wawa-fire .wawa-frog { animation: 0.7s ease-in-out 0s infinite alternate none running wawa-dance; }
.wawa-fire .wawa-arm-l { animation: 0.35s ease-in-out 0s infinite alternate none running wawa-pump-l; }
.wawa-fire .wawa-arm-r { animation: 0.35s ease-in-out 0.35s infinite alternate none running wawa-pump-r; }
@keyframes wawa-breathe { 
  0%, 100% { transform: scale(1, 1); }
  50% { transform: scale(1.015, 1.03); }
}
@keyframes wawa-blink { 
  0%, 92%, 100% { transform: scaleY(1); }
  95% { transform: scaleY(0.08); }
}
@keyframes wawa-twinkle { 
  0%, 100% { opacity: 0; transform: scale(0.3) rotate(0deg); }
  50% { opacity: 1; transform: scale(1) rotate(45deg); }
}
@keyframes wawa-hop { 
  0% { transform: translateY(0px) scale(1, 1); }
  20% { transform: translateY(3px) scale(1.06, 0.92); }
  50% { transform: translateY(-24px) scale(0.96, 1.05); }
  80% { transform: translateY(0px) scale(1.05, 0.94); }
  100% { transform: translateY(0px) scale(1, 1); }
}
@keyframes wawa-jump { 
  0% { transform: translateY(0px) scale(1, 1); }
  12% { transform: translateY(4px) scale(1.1, 0.88); }
  40% { transform: translateY(-52px) scale(0.94, 1.08); }
  55% { transform: translateY(-54px) scale(1, 1); }
  78% { transform: translateY(0px) scale(1.1, 0.9); }
  88% { transform: translateY(0px) scale(0.97, 1.03); }
  100% { transform: translateY(0px) scale(1, 1); }
}
@keyframes wawa-shadow-jump { 
  0%, 100% { transform: scale(1); opacity: 0.12; }
  40%, 55% { transform: scale(0.55); opacity: 0.06; }
}
@keyframes wawa-cheer-l { 
  0% { transform: rotate(8deg); }
  100% { transform: rotate(-14deg); }
}
@keyframes wawa-cheer-r { 
  0% { transform: rotate(-8deg); }
  100% { transform: rotate(14deg); }
}
@keyframes wawa-wave { 
  0% { transform: rotate(-10deg); }
  100% { transform: rotate(18deg); }
}
@keyframes wawa-droop { 
  0%, 100% { transform: rotate(0deg) translateY(0px); }
  50% { transform: rotate(-3deg) translateY(3px); }
}
@keyframes wawa-dance { 
  0% { transform: rotate(-7deg) translateY(0px); }
  100% { transform: rotate(7deg) translateY(-8px); }
}
@keyframes wawa-pump-l { 
  0% { transform: rotate(-55deg); }
  100% { transform: rotate(6deg); }
}
@keyframes wawa-pump-r { 
  0% { transform: rotate(55deg); }
  100% { transform: rotate(-6deg); }
}
.wawa * { animation: auto ease 0s 1 normal none running none !important; }
.friend { overflow: visible; }
.friend g, .friend path, .friend text { transform-box: view-box; }
.friend-blink { transform-origin: center center; animation: 4.8s ease 0s infinite normal none running wawa-blink; transform-box: fill-box !important; }
.friend-locked { filter: grayscale(1); opacity: 0.4; }
.friend-locked *, .friend-locked { animation-play-state: paused !important; }
.friend-body { transform-origin: 100px 176px; }
.friend-happy .friend-body { animation: 0.6s ease-out 0s 2 normal none running wawa-hop; }
.friend-celebrate .friend-body { animation: 1.2s cubic-bezier(0.3, 0.7, 0.4, 1) 0s infinite normal none running wawa-jump; }
.friend-sad .friend-body { animation: 1.8s ease-in-out 0s infinite normal none running wawa-droop; }
.friend-look { transition: transform 0.25s ease-out; }
.friend-sad .friend-look { transform: translateY(3px); }
.flag-wave { transform-origin: left center; animation: 1.1s ease-in-out 0s infinite alternate none running flag-wave; transform-box: fill-box !important; }
.tembleque { transform-origin: center bottom; animation: 0.45s ease-in-out 0s infinite alternate none running tembleque; transform-box: fill-box !important; }
@keyframes flag-wave { 
  0% { transform: skewY(-7deg) scaleX(0.94); }
  100% { transform: skewY(5deg) scaleX(1); }
}
@keyframes tembleque { 
  0% { transform: rotate(-7deg); }
  100% { transform: rotate(7deg); }
}
.harpia-head { transform-origin: 100px 112px; animation: 4s ease-in-out 0s infinite normal none running harpia-look; }
.harpia-wing-l { transform-origin: 66px 100px; animation: 4s ease-in-out 0s infinite normal none running harpia-flap-l; }
.harpia-wing-r { transform-origin: 134px 100px; animation: 4s ease-in-out 0s infinite normal none running harpia-flap-r; }
@keyframes harpia-look { 
  0%, 18%, 100% { transform: rotate(0deg); }
  26%, 40% { transform: rotate(-14deg); }
  50%, 64% { transform: rotate(12deg); }
}
@keyframes harpia-flap-l { 
  0%, 80%, 100% { transform: rotate(0deg); }
  85%, 93% { transform: rotate(40deg); }
  89% { transform: rotate(5deg); }
}
@keyframes harpia-flap-r { 
  0%, 80%, 100% { transform: rotate(0deg); }
  85%, 93% { transform: rotate(-40deg); }
  89% { transform: rotate(-5deg); }
}
.sloth-swing { transform-origin: 100px 30px; animation: 3.6s ease-in-out 0s infinite alternate none running sloth-swing; }
.sloth-z { opacity: 0; animation: 3s ease-out 0s infinite normal none running sloth-z; transform-box: fill-box !important; }
@keyframes sloth-swing { 
  0% { transform: rotate(-8deg); }
  100% { transform: rotate(8deg); }
}
@keyframes sloth-swing-big { 
  0% { transform: rotate(-16deg); }
  100% { transform: rotate(16deg); }
}
.friend-happy .sloth-swing { animation: 0.35s ease-in-out 0s 4 alternate none running sloth-swing-big; }
.friend-celebrate .sloth-swing { animation: 0.5s ease-in-out 0s infinite alternate none running sloth-swing-big; }
.friend-sad .sloth-swing { animation: 4s ease-in-out 0s infinite alternate none running sloth-swing; }
.friend-celebrate .harpia-wing-l { animation: 0.25s ease-in-out 0s infinite alternate none running harpia-cheer-l; }
.friend-celebrate .harpia-wing-r { animation: 0.25s ease-in-out 0s infinite alternate none running harpia-cheer-r; }
.friend-happy .harpia-wing-l { animation: 0.2s ease-in-out 0s 4 alternate none running harpia-cheer-l; }
.friend-happy .harpia-wing-r { animation: 0.2s ease-in-out 0s 4 alternate none running harpia-cheer-r; }
@keyframes harpia-cheer-l { 
  0% { transform: rotate(10deg); }
  100% { transform: rotate(55deg); }
}
@keyframes harpia-cheer-r { 
  0% { transform: rotate(-10deg); }
  100% { transform: rotate(-55deg); }
}
@keyframes sloth-z { 
  0% { opacity: 0; transform: translate(0px, 0px); }
  25% { opacity: 1; }
  100% { opacity: 0; transform: translate(14px, -26px); }
}
.tucan-body { transform-origin: 95px 172px; animation: 2.6s ease-in-out 0s infinite normal none running tucan-hop; }
.tucan-berry { animation: 2.6s ease-in-out 0s infinite normal none running tucan-berry; }
.friend-happy .tucan-body { animation: 0.6s ease-out 0s 2 normal none running wawa-hop; }
.friend-celebrate .tucan-body { animation: 1.2s cubic-bezier(0.3, 0.7, 0.4, 1) 0s infinite normal none running wawa-jump; }
.friend-sad .tucan-body { animation: 1.8s ease-in-out 0s infinite normal none running wawa-droop; }
@keyframes tucan-hop { 
  0%, 60%, 100% { transform: translateY(0px) scale(1, 1); }
  66% { transform: translateY(2px) scale(1.04, 0.95); }
  76% { transform: translateY(-10px) scale(0.98, 1.03); }
  86% { transform: translateY(0px) scale(1.03, 0.97); }
}
@keyframes tucan-berry { 
  0% { transform: translate(0px, 0px); opacity: 1; }
  30% { transform: translate(-6px, -54px); }
  55% { transform: translate(-30px, 2px); opacity: 1; }
  58%, 92% { transform: translate(-30px, 2px); opacity: 0; }
  100% { transform: translate(0px, 0px); opacity: 1; }
}
.friend * { animation: auto ease 0s 1 normal none running none !important; }
.fly, .fly-tongue, .fly-yum, .tucan-berry { display: none; }
</style><g><rect x="18" y="166" width="164" height="12" rx="6" fill="#8a5a34"></rect><ellipse cx="30" cy="162" rx="10" ry="5" fill="#5b8f3a" transform="rotate(-20 30 162)"></ellipse><ellipse cx="172" cy="164" rx="9" ry="4.5" fill="#6fa64a" transform="rotate(15 172 164)"></ellipse></g><g class="friend-body"><path d="M88 160 L100 192 L112 160Z" fill="#3d3f45"></path><g class="harpia-wing-l"><ellipse cx="62" cy="130" rx="18" ry="38" fill="#4a4e57" transform="rotate(12 62 130)"></ellipse></g><g class="harpia-wing-r"><ellipse cx="138" cy="130" rx="18" ry="38" fill="#4a4e57" transform="rotate(-12 138 130)"></ellipse></g><ellipse cx="100" cy="128" rx="42" ry="44" fill="#8e939c"></ellipse><ellipse cx="100" cy="142" rx="30" ry="28" fill="#f6f3ee"></ellipse><path d="M66 110 Q100 128 134 110 Q134 122 100 136 Q66 122 66 110Z" fill="#3d3f45"></path><ellipse cx="86" cy="168" rx="9" ry="6" fill="#f2b544"></ellipse><ellipse cx="114" cy="168" rx="9" ry="6" fill="#f2b544"></ellipse><circle cx="80" cy="173" r="2.4" fill="#2b2420"></circle><circle cx="86" cy="175" r="2.4" fill="#2b2420"></circle><circle cx="92" cy="173" r="2.4" fill="#2b2420"></circle><circle cx="108" cy="173" r="2.4" fill="#2b2420"></circle><circle cx="114" cy="175" r="2.4" fill="#2b2420"></circle><circle cx="120" cy="173" r="2.4" fill="#2b2420"></circle><g class="harpia-head"><circle cx="100" cy="72" r="42" fill="#b9bec6"></circle><ellipse cx="100" cy="80" rx="33" ry="28" fill="#e6e8ec"></ellipse><g class="friend-look"><g class="friend-blink"><circle cx="84" cy="74" r="11" fill="#2b2420"></circle><circle cx="87.85" cy="70.15" r="3.96" fill="#fff"></circle><circle cx="80.7" cy="78.18" r="1.76" fill="#fff"></circle></g></g><g class="friend-look"><g class="friend-blink"><circle cx="116" cy="74" r="11" fill="#2b2420"></circle><circle cx="119.85" cy="70.15" r="3.96" fill="#fff"></circle><circle cx="112.7" cy="78.18" r="1.76" fill="#fff"></circle></g></g><path d="M72 60 L92 65 M128 60 L108 65" stroke="#3d3f45" stroke-width="4" stroke-linecap="round"></path><ellipse cx="72" cy="91" rx="8" ry="5" fill="#ff8a73" opacity=".45"></ellipse><ellipse cx="128" cy="91" rx="8" ry="5" fill="#ff8a73" opacity=".45"></ellipse><path d="M90 84 Q100 78 110 84 Q110 96 102 104 Q100 106 99 103 Q96 98 90 84Z" fill="#3a3a40"></path><path d="M94 85 Q100 82 105 85" stroke="#8e939c" stroke-width="1.6" fill="none" stroke-linecap="round"></path><g transform="translate(100 40) scale(1.05) translate(-100 -40)"><ellipse cx="100" cy="2" rx="5.5" ry="12" fill="#d21034"></ellipse><ellipse cx="100" cy="-6" rx="3.5" ry="5" fill="#fff"></ellipse><path d="M77 40 L81 8 Q100 4 119 8 L123 40Z" fill="#1f3a6e"></path><path d="M81 8 Q100 4 119 8 L118.4 13 Q100 9 81.6 13Z" fill="#f2b544"></path><polygon points="100.00,16.00 101.97,21.28 107.61,21.53 103.20,25.04 104.70,30.47 100.00,27.36 95.30,30.47 96.80,25.04 92.39,21.53 98.03,21.28" fill="#f2b544"></polygon><path d="M78 34 Q100 38 122 34" stroke="#f2b544" stroke-width="2" fill="none"></path><ellipse cx="100" cy="41" rx="28" ry="5.5" fill="#111827"></ellipse></g></g></g></svg>