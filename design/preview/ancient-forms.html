<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ancient forms</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; padding: 20px; background: #fbf7f0; font-family: Nunito, system-ui, sans-serif; color: #2b2420; }
  h1 { margin: 0 0 4px; color: #0a426d; font-size: 24px; }
  h2 { margin: 26px 0 4px; color: #0a426d; font-size: 18px; }
  p.note { margin: 0 0 10px; color: #8b7f75; font-weight: 700; font-size: 13.5px; max-width: 760px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .cell { width: 168px; background: #fff; border: 2px solid #ece2d4; border-radius: 16px; padding: 10px; text-align: center; }
  .pair { display: flex; align-items: center; justify-content: center; gap: 6px; height: 74px; }
  .pair img { width: 66px; height: 66px; }
  .pair .arrow { color: #c9bfb1; font-weight: 900; }
  .han { font-family: 'Noto Sans SC', sans-serif; font-size: 50px; line-height: 1; }
  .cap { margin-top: 6px; font-size: 12.5px; font-weight: 800; min-height: 32px; }
  .parts { font-size: 12px; font-weight: 800; color: #6b7c8c; margin-top: 4px; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; margin: 1px; }
  .sem { background: #dff3eb; color: #1f7a5f; }
  .pho { background: #e3effb; color: #2a6fae; }
  .none { color: #b9ada0; font-size: 12px; font-weight: 800; }
</style>
</head>
<body>
  <h1>Ancient forms · Panama &amp; Panama Oeste</h1>
  <p class="note">Each card shows the oldest form we found (oracle bone, or bronze / seal when there is no oracle form) next to the modern character. Groups follow Make Me a Hanzi. Ancient forms: Wikimedia Commons, Ancient Chinese characters project (public domain).</p>
  <div id="out"></div>
<script>
(async () => {
  const [forms, ety] = await Promise.all([
    fetch('../word-art/ancient/manifest.json').then((r) => r.json()),
    fetch('../word-art/char-etymology.json').then((r) => r.json()),
  ]);
  // Commons names files by the traditional or full form.
  const FULL = { 儿: '兒', 讠: '言', 亻: '人', 门: '門', 马: '馬', 辶: '辵', 氵: '水', 尔: '爾' };
  const formOf = (g) => forms[FULL[g] || g];
  const img = (g) => { const f = formOf(g); return f ? `<img src="../word-art/ancient/${f.file}" title="${g} · ${f.script}">` : ''; };
  const GROUPS = [
    ['pictographic', 'Pictures · the old form looks like the thing', 'Old form turns into the modern character.'],
    ['ideographic', 'Ideas · two or more pictures together', 'The old forms of the parts come together.'],
    ['pictophonetic', 'Meaning + sound', 'The meaning part has its old form; the sound part is only a sound hint.'],
    ['unknown', 'No clear history', 'Shown with strokes only.'],
  ];
  const parts = (d) => (d || '').replace(/[⿰⿱⿲⿳⿴⿵⿶⿷⿸⿹⿺⿻？]/g, '').split('');
  let html = '';
  for (const [type, title, note] of GROUPS) {
    const chars = Object.entries(ety).filter(([, e]) => e.type === type);
    html += `<h2>${title} (${chars.length})</h2><p class="note">${note}</p><div class="grid">`;
    for (const [c, e] of chars) {
      let pics = '', tags = '';
      if (type === 'pictographic') pics = img(c);
      else if (type === 'pictophonetic') {
        pics = e.semantic ? img(e.semantic) : '';
        tags = (e.semantic ? `<span class="tag sem">${e.semantic} meaning</span>` : '') + (e.phonetic ? `<span class="tag pho">${e.phonetic} 🔊 sound</span>` : '');
      } else if (type === 'ideographic') {
        pics = parts(e.decomposition).map(img).filter(Boolean).join('');
        tags = parts(e.decomposition).map((g) => `<span class="tag sem">${g}</span>`).join('');
      }
      html += `<div class="cell"><div class="pair">${pics || '<span class="none">no old form</span>'}<span class="arrow">→</span><span class="han">${c}</span></div>
        <div class="cap">${e.hint || ''}</div><div class="parts">${tags}</div></div>`;
    }
    html += '</div>';
  }
  document.getElementById('out').innerHTML = html;
})();
</script>
</body>
</html>
